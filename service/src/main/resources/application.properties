# The application config for qits-agents as a standalone process (ordinal 250). The library jars
# ship their defaults at ordinal 100 in META-INF/microprofile-config.properties: `domain` its
# datasource, persistence unit and Flyway lineage; qits-eventstream its bus url, outbox datasource
# and retry budget. A deployment still overrides any of it by env.

quarkus.application.name=qits-agents

# Every route lives under /agents: the API at /agents/api, and Quarkus' own non-application root
# (health, the API document) at /agents/q, where the deploy gates on /agents/q/health/ready
# (.config/qits/deployments.yml).
quarkus.http.root-path=/agents
quarkus.rest.path=/api
quarkus.http.non-application-root-path=q

# --- machine identity -----------------------------------------------------------------------------
# EVERY DOOR TAKES A BEARER: there is no anonymous door here. Each resource names its roles with
# @RolesAllowed (see api/Roles); the runner doors add the self check (api/SelfOrOperator).
#
# THE ROLLOUT GATE SHIPS ON (qits.auth.machine.required, defaulted false by qits-auth-core — this
# literal overrides that library default at ordinal 250). On, quarkus-oidc validates every bearer
# against qits-idp; off, there is no OIDC tenant at all. %dev./%test. put it off, which is what lets
# a clone-alone `./mvnw verify` need no issuer: the suites state their callers themselves.
qits.auth.machine.required=true
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
%dev.qits.auth.machine.required=false
%test.qits.auth.machine.required=false

# Bearer-only: this service starts no login flow and holds no session.
#
# THE IDP IS DIALLED AT ITS EDGE HOST: https://idp.qits.<domain>/idp, never a wire alias.
# QITS_DOMAIN is injected into every container by qits-deployments and carries NO default here: a
# deployment without it refuses to start rather than validating against a half name.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN}/idp
quarkus.oidc.application-type=service

# ONE audience on this platform, carried by every token — a service's, a person's, an agent's
# commissioned token alike — so it is a literal: what a caller may do is decided by its roles.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE: the boot-time JWKS fetch fails to a WARN and is
# retried for connection-delay, and readiness stays independent of idp.
quarkus.oidc.connection-delay=30S

# A ROTATED idp key reaches this service in seconds rather than the default ten minutes.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits`: this process's own qits-idp service client by client credentials, the
# `idp:client` resource .config/qits/deployments.yml declares (id `<env>-qits-agents`). The
# qits-eventstream library and qits-telemetry-core ask OidcClients for it by name, and so does the
# reconcile's qits-projects read (projects/ServiceBearer). Its id and secret are also the HTTP Basic
# pair the agents' tokens are commissioned with (idp/IdpAgentCredentials). Reference the raw env
# names inside `${…}`: QITS_RESOURCE_* has no dotted twin.
quarkus.oidc-client.qits.auth-server-url=${qits.agents.idp.url}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-agents}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- qits-idp, where the agents' tokens are commissioned -------------------------------------------
# POST {url}/api/tokens and DELETE {url}/api/tokens/{tokenId} (idp/IdpTokensApi), HTTP Basic as
# this service's own client. The url ends in /idp.
qits.agents.idp.url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
quarkus.rest-client.qits-idp.url=${qits.agents.idp.url}
quarkus.rest-client.qits-idp.connect-timeout=2000
quarkus.rest-client.qits-idp.read-timeout=10000

# --- qits-projects, which names a roster's project ---------------------------------------------------
# GET /projects/api/projects (projects/ProjectsApi): the project list, slug to id. Scheme, host and
# port, no path: qits-projects serves its own /projects/api. THROUGH THE EDGE, as every platform
# host is reached; the edge accepts this service's own `qits` bearer.
qits.agents.projects.url=https://projects.qits.${QITS_DOMAIN}
quarkus.rest-client.qits-projects.url=${qits.agents.projects.url}
quarkus.rest-client.qits-projects.connect-timeout=2000
quarkus.rest-client.qits-projects.read-timeout=10000

# --- the roster reconcile ----------------------------------------------------------------------------
# At boot every roster on the classpath is validated (a broken one fails the boot) and, with this
# on, reconciled into the agent rows; RosterReconcileTrigger re-runs it every interval to heal a
# boot that could not reach qits-projects or qits-idp. Idempotent: an unchanged roster writes
# nothing. %test turns it off; the suites drive RosterReconcile directly.
qits.agents.roster-reconcile-at-boot=true
%test.qits.agents.roster-reconcile-at-boot=false
qits.agents.roster-reconcile-interval=10m

# The roster jar's texts (the brief and the recovery prompt), read from its classpath at class
# init: the native image carries only the resources it is told to.
quarkus.native.resources.includes=eu/wohlben/qits/agents/roster/**

# --- the API document ------------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=qits-agents API
quarkus.swagger-ui.always-include=true

# --- the packaged artifact -------------------------------------------------------------------------
# The binary is `qits-agents` (no -runner suffix); spelled again as failsafe's native.image.path in
# service/pom.xml and in docker/Dockerfile. The three move together.
quarkus.package.output-name=qits-agents
quarkus.package.jar.add-runner-suffix=false

# --- the platform event bus ------------------------------------------------------------------------
# Nothing the bus needs is spelled here: it ships its own defaults. What belongs here is the
# darkness outside a deployment — a clone-alone `./mvnw verify` has no qits-events. Dark is not
# absent: the outbox datasource still opens and migrates, which is why the suite owes it a database.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- telemetry -------------------------------------------------------------------------------------
# OTLP to qits-observability through the edge, by qits-telemetry-core's CDI exporters that attach
# the `qits` client's bearer. The three log keys are spelled out because Quarkus still labels its
# OpenTelemetry logging PREVIEW: a changed default must be a diff, not a silence.
quarkus.otel.traces.exporter=cdi
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
