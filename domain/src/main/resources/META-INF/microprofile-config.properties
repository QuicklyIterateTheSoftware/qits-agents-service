# qits-agents domain defaults, shipped from this library jar at ordinal 100. The deployable's
# application.properties (250) and the environment (300) override any of them.
#
# THE PLATFORM'S GENERIC RESOURCE CONTRACT. .config/qits/deployments.yml declares
# `postgresql:db:qits_agents`; qits-deployments creates the role and the database before the
# container starts and injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD. No defaults, on purpose:
# an unset variable fails the boot at Flyway naming what is missing, rather than opening some store
# nobody meant. The suite supplies the values (service/src/test/.../testdb/EmbeddedPgConfigSource).
quarkus.datasource.agents.db-kind=postgresql
quarkus.datasource.agents.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.agents.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.agents.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER. All three lines or none: DatasourceBaselineTest fails the
# build if one goes missing.
quarkus.datasource.agents.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.agents.jdbc.acquisition-timeout=15S
quarkus.datasource.agents.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to this datasource, owning only this module's entities, in the
# schema `agents` that the lineage below creates and migrates.
quarkus.hibernate-orm.agents.datasource=agents
quarkus.hibernate-orm.agents.packages=eu.wohlben.qits.agents.service.entity
quarkus.hibernate-orm.agents.database.default-schema=agents

# Own Flyway lineage, hand-written and appended to. No baseline-on-migrate: every database this
# lineage meets is empty or was created by it. `schemas` makes Flyway create the schema and keep
# its history table there.
quarkus.flyway.agents.migrate-at-start=true
quarkus.flyway.agents.schemas=agents
quarkus.flyway.agents.locations=classpath:db/agents/migration
