# How qits-deployments deploys this repository. It reads this file from the git host at the built
# sha, so the answer travels with the commit; carrying the file at all is what says it deploys.
#
# THE DEPLOYED IDENTITY: the application qits-agents, its image qits/qits-agents, its databases and
# its idp client all carry this name.
application: qits-agents

# https://agents.qits.<domain>/agents: the API at /agents/api, health and the API document at
# /agents/q.
host: agents
routes: /agents
health_path: /agents/q/health/ready
api-docs: /agents/q/swagger-ui

# TWO DATABASES AND A SERVICE CLIENT.
#   db           qits_agents: agent, agent_claim, agent_turn (domain's Flyway lineage, schema agents).
#   eventstream  qits_agents_eventstream: the qits-eventstream outbox. The resource NAME is
#                load-bearing — the jar reads QITS_RESOURCE_EVENTSTREAM_*.
#   idp:client   this application's own qits-idp service client, `<env>-qits-agents`: the bearer the
#                eventstream library, the telemetry exporters and the qits-projects read present,
#                and the Basic pair the agents' tokens are commissioned with.
resources: postgresql:db:qits_agents, postgresql:eventstream:qits_agents_eventstream, idp:client

# PRIVATE, like every service that calls qits-projects (qits-1980): projects.qits.<domain> is
# served by qits-edge-private only, and 2026.1123.214914, deployed public, timed out dialing it
# (100.96.0.1:443) so its roster reconcile never ran. Served by qits-edge-private, reached through
# the WireGuard tunnel or the qits-private overlay; workspaces and agent containers reach it there.
# Its databases live on the private Postgres. Revert: delete this line.
exposure: private
